apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: ci-cd-run-
spec:
  pipelineRef:
    name: ci-cd
  params:
    - name: repo-url
      value: https://github.com/Atharva-0110/ci-cd-final-project
    - name: app-name
      value: flask
    - name: build-image
      value: image-registry.openshift-image-registry.svc:5000/sn-labs-atharvabagad/flask:latest
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: oc-lab-pvc
